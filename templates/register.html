{% extends "base.html" %}
{% block title %}Sign Up — Eventify{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="glass-card auth-card" data-aos="zoom-in">
    <div class="text-center mb-4">
      <span class="gradient-text fs-3 display-font">🎟️ EVENTIFY</span>
      <h4 class="mt-3 mb-1">Create your account</h4>
      <p class="text-dim" style="font-size:.9rem;">Join Eventify and start booking in minutes</p>
    </div>
    <form method="post" id="registerForm" novalidate>
      <div class="mb-3">
        <label class="form-label-glass">Full Name</label>
        <input type="text" name="name" required value="{{ form.name or '' }}" class="form-control form-control-glass" placeholder="Aarav Sharma">
      </div>
      <div class="mb-3">
        <label class="form-label-glass">Email</label>
        <input type="email" name="email" required value="{{ form.email or '' }}" class="form-control form-control-glass" placeholder="you@example.com">
      </div>
      <div class="mb-3">
        <label class="form-label-glass">Phone</label>
        <input type="tel" name="phone" value="{{ form.phone or '' }}" class="form-control form-control-glass" placeholder="98765 43210">
      </div>
      <div class="mb-3">
        <label class="form-label-glass">Password</label>
        <div class="position-relative">
          <input type="password" id="regPassword" name="password" required minlength="6" class="form-control form-control-glass" placeholder="At least 6 characters">
          <button type="button" class="btn toggle-password position-absolute top-50 end-0 translate-middle-y border-0 bg-transparent text-dim" data-target="#regPassword" style="right:8px;">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label-glass">Confirm Password</label>
        <input type="password" name="confirm_password" required class="form-control form-control-glass" placeholder="Re-enter password">
      </div>
      <button type="submit" class="btn btn-glow w-100 mb-3">Create Account</button>
      <p class="text-center text-dim mb-0" style="font-size:.9rem;">Already have an account? <a href="{{ url_for('login') }}" class="gradient-text fw-semibold">Login</a></p>
    </form>
  </div>
</div>
{% endblock %}
