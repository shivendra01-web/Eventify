{% extends "base.html" %}
{% block title %}Notifications — Eventify{% endblock %}
{% block content %}
<section style="padding-top:120px;" class="pb-5">
  <div class="container" style="max-width:640px;">
    <div class="mb-4 d-flex justify-content-between align-items-end flex-wrap gap-2" data-aos="fade-up">
      <h2 class="section-title mb-0">Notifications</h2>
      {% if items %}
      <form method="post" action="{{ url_for('notifications_mark_all_read') }}">
        <button type="submit" class="btn btn-outline-glow btn-sm">Mark all as read</button>
      </form>
      {% endif %}
    </div>

    <div class="glass-card p-2" data-aos="fade-up">
      {% if items %}
        {% for n in items %}
        <form method="post" action="{{ url_for('notification_open', notif_id=n.id) }}">
          <button type="submit" class="d-flex align-items-start gap-3 p-3 w-100 text-start border-0 bg-transparent notif-row {% if not n.is_read %}unread{% endif %}">
            <div class="notif-dot {% if not n.is_read %}active{% endif %}"></div>
            <div class="flex-grow-1">
              <div class="text-white" style="font-size:.9rem;">{{ n.title }}</div>
              {% if n.body %}<div class="text-dim" style="font-size:.82rem;">{{ n.body }}</div>{% endif %}
              <div class="text-faint" style="font-size:.74rem;">{{ n.created_at.strftime('%d %b, %H:%M') }}</div>
            </div>
          </button>
        </form>
        {% endfor %}
      {% else %}
        <div class="text-center py-5">
          <i class="fa-regular fa-bell text-faint fs-3 mb-2 d-block"></i>
          <p class="text-dim mb-0">You're all caught up.</p>
        </div>
      {% endif %}
    </div>
  </div>
</section>
{% endblock %}
