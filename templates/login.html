{% extends "base.html" %}
{% block title %}Login — Eventify{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="glass-card auth-card" data-aos="zoom-in">
    <div class="text-center mb-4">
      <span class="gradient-text fs-3 display-font">🎟️ EVENTIFY</span>
      <h4 class="mt-3 mb-1">Welcome back</h4>
      <p class="text-dim" style="font-size:.9rem;">Login to manage your bookings</p>
    </div>
    <form method="post">
      <div class="mb-3">
        <label class="form-label-glass">Email</label>
        <input type="email" name="email" required class="form-control form-control-glass" placeholder="you@example.com">
      </div>
      <div class="mb-3">
        <label class="form-label-glass">Password</label>
        <div class="position-relative">
          <input type="password" id="loginPassword" name="password" required class="form-control form-control-glass" placeholder="••••••••">
          <button type="button" class="btn toggle-password position-absolute top-50 end-0 translate-middle-y border-0 bg-transparent text-dim" data-target="#loginPassword" style="right:8px;">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
          <input type="checkbox" name="remember" class="form-check-input" id="remember">
          <label class="form-check-label text-dim" for="remember" style="font-size:.85rem;">Remember me</label>
        </div>
        <a href="#" class="text-dim" style="font-size:.85rem;" data-bs-toggle="tooltip" title="Contact support to reset your password">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-glow w-100 mb-3">Login</button>
      <p class="text-center text-dim mb-0" style="font-size:.9rem;">Don't have an account? <a href="{{ url_for('register') }}" class="gradient-text fw-semibold">Sign up</a></p>
    </form>
  </div>
</div>
{% endblock %}
